spring:
  application:
    name: review-system

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/reviewdb
    username: ${DB_USER:review}
    password: ${DB_PASSWORD:review}
    hikari:
      # v1 은 Spring Boot 기본값 10 을 그대로 쓴다. v4 의 튜닝 대상.
      # 이 값이 v1 처리량의 실질적인 상한이다 — docs/00-capacity-planning.md 4절 참고.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # 커넥션을 못 받으면 30초 기다리다 죽는다. 부하 테스트에서 이 예외가 보이면 풀 고갈이다.
      connection-timeout: 30000

  jpa:
    hibernate:
      # 스키마는 infra/postgres/init/01-schema.sql 이 소유한다.
      # 인덱스를 붙였다 뗐다 하며 실험하려면 JPA 가 스키마를 만들면 안 된다.
      ddl-auto: validate
    # 트랜잭션 밖에서 커넥션을 붙들고 있지 않도록 끈다. (기본 true 는 안티패턴)
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  tomcat:
    mbeanregistry:
      # 이걸 켜야 tomcat_threads_busy_threads 같은 스레드 풀 지표가 노출된다.
      # 끄면 Grafana 의 '톰캣 스레드' 패널이 빈 채로 나온다.
      enabled: true
    threads:
      # Spring Boot 기본값. v4 튜닝 대상.
      max: ${TOMCAT_MAX_THREADS:200}
    accept-count: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: review-system
    # p95/p99 를 Prometheus 쪽에서 계산할 수 있도록 히스토그램 버킷을 내보낸다.
    # 이게 없으면 Grafana 에서 percentile 을 그릴 수 없다.
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s
  observations:
    key-values:
      application: review-system
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO

---
# SQL 을 눈으로 확인할 때만 쓰는 프로파일: ./gradlew bootRun --args='--spring.profiles.active=sqllog'
# N+1 이 실제로 몇 번 나가는지 세어 보는 용도. 부하 테스트 중에는 절대 켜지 말 것 (로깅 자체가 병목이 된다).
spring:
  config:
    activate:
      on-profile: sqllog
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
