name: review-system

services:
  postgres:
    image: postgres:17-alpine
    container_name: review-postgres
    environment:
      POSTGRES_DB: reviewdb
      POSTGRES_USER: review
      POSTGRES_PASSWORD: review
      # 컨테이너 재기동 시 초기화 스크립트를 다시 돌리려면 `down -v` 로 볼륨을 지워야 한다.
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    command:
      # v1 은 기본값에 가깝게 둔다. v4~v5 에서 이 값들을 직접 만지며 실험한다.
      - "postgres"
      - "-c"
      - "max_connections=100"        # 앱을 여러 대로 늘리면 여기서 먼저 터진다 (v5)
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "log_min_duration_statement=1000"  # 1초 넘는 쿼리를 로그에 남긴다
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review -d reviewdb"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: review-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    container_name: review-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # 앱을 호스트에서 ./gradlew bootRun 으로 띄우기 때문에,
      # 컨테이너 안의 Prometheus 가 호스트를 찾아갈 수 있어야 한다.
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: review-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: review-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://review:review@postgres:5432/reviewdb?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
